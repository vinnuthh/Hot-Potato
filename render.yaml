services:
  - type: web
    name: hot-potato-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGIN
        value: '*'
      - key: ROOM_TTL_HOURS
        value: 12
      - key: DISCONNECT_GRACE_MS
        value: 15000
